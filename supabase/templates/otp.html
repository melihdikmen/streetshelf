<!-- Sign-in code email. The app asks for the 6-digit code; there is no link to
     click, so the same email works on any device and needs no deep linking. -->
<div style="font-family: -apple-system, Helvetica, Arial, sans-serif; color: #17201A; max-width: 420px; margin: 0 auto; padding: 32px 24px;">
  <p style="font-size: 20px; font-weight: 700; margin: 0 0 16px;">NeighborLend</p>
  <p style="font-size: 15px; margin: 0 0 24px;">Giriş kodun / Your sign-in code:</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 8px; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="font-size: 13px; color: #7A857D; margin: 0;">
    Bu kodu sen istemediysen bu e-postayı yok sayabilirsin. Kod bir saat geçerli.<br />
    If you did not ask for this code, ignore this email. It expires in one hour.
  </p>
</div>
